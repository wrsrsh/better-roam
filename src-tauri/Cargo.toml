[package]
name = "roam-desktop"
version = "0.2.0"
description = "A minimal, persistent Roam Research desktop window"
edition = "2021"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSButton", "NSView", "NSControl", "NSResponder"] }
